name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${tag} -X main.commit=${commit} -X main.date=${build_date}"

          mkdir -p dist build
          targets=(
            "windows amd64 zip"
            "windows arm64 zip"
            "linux amd64 tar.gz"
            "linux arm64 tar.gz"
            "darwin amd64 tar.gz"
            "darwin arm64 tar.gz"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch archive_type <<< "${target}"
            binary="plugproxy"
            if [ "${goos}" = "windows" ]; then
              binary="plugproxy.exe"
            fi

            rm -rf build/*
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build -trimpath -ldflags "${ldflags}" -o "build/${binary}" ./cmd/plugproxy

            archive="plugproxy_${tag}_${goos}_${goarch}"
            if [ "${archive_type}" = "zip" ]; then
              (cd build && zip -q "../dist/${archive}.zip" "${binary}")
            else
              tar -C build -czf "dist/${archive}.tar.gz" "${binary}"
            fi
          done

          (cd dist && sha256sum * > checksums.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "plugproxy ${GITHUB_REF_NAME}"
